<div *ngIf="!product" class="card p-5 text-center text-muted">
  <i class="bi bi-info-circle display-4 mb-3"></i>
  <h4>Nessun prodotto selezionato</h4>
  <p>Clicca su un prodotto nella lista per vederne i dettagli.</p>
</div>

<div *ngIf="product" class="card shadow-sm">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <h3 class="card-title fw-bold m-0">{{ product.name }}</h3>
      <span class="badge rounded-pill fs-5" 
            [ngClass]="product.price > 100 ? 'bg-warning text-dark' : 'bg-primary'">
        {{ product.price | currency:'EUR' }}
      </span>
    </div>
    
    <hr>
    
    <div class="mb-4 mt-4">
      <h5 class="text-muted mb-2">Descrizione:</h5>
      <p class="card-text fs-5">{{ product.description }}</p>
    </div>
    
    <div class="d-grid mt-4">
      <button class="btn btn-danger" (click)="elimina()">
        <i class="bi bi-trash me-2"></i>Elimina Prodotto
      </button>
    </div>
  </div>
</div>
