<div *ngIf="!product" class="card p-5 text-center text-muted">
  <i class="bi bi-info-circle display-4 mb-3"></i>
  <h4>{{ 'DETAIL.NO_SELECTION' | translate }}</h4>
  <p>{{ 'DETAIL.SELECT' | translate }}</p>
</div>

<div *ngIf="product" class="card shadow-sm">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <h3 class="card-title fw-bold m-0">{{ product.name }}</h3>
      <span class="badge rounded-pill fs-5" 
            [ngClass]="product.price > 100 ? 'bg-warning text-dark' : 'bg-primary'">
        {{ product.price | currency:'EUR' }}
      </span>
    </div>
    
    <hr>
    
    <div class="mb-4 mt-4">
      <h5 class="text-muted mb-2">{{ 'PRODUCT.DESC' | translate }}</h5>
      <p class="card-text fs-5" style="color: var(--text-color);">{{ product.description }}</p>
    </div>
    
    <div class="d-grid mt-4">
      <button class="btn btn-danger" style="border-radius: 50px;" (click)="elimina()">
        <i class="bi bi-trash me-2"></i>{{ 'DETAIL.DELETE' | translate }}
      </button>
    </div>
  </div>
</div>
