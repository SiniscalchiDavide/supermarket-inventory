<li class="nav-item dropdown custom-dropdown-wrapper">
  <!-- Sostituiamo il classico link <a> con un <button> in stile nav-link -->
  <button class="nav-link d-flex justify-content-between align-items-center bg-transparent border-0 w-100 text-start" 
          type="button" 
          id="navbarDropdown" 
          data-bs-toggle="dropdown" 
          aria-expanded="false"
          style="gap: 0.5rem; box-shadow: none;">
    <span>{{ 'SECTIONS.TITLE' | translate }}</span>
    <i class="bi bi-chevron-down text-muted" style="font-size: 0.8rem;"></i>
  </button>

  <ul class="dropdown-menu shadow-sm" aria-labelledby="navbarDropdown">
    <li *ngFor="let sezione of sezioni">
      <a class="dropdown-item" [routerLink]="['/sezione', sezione.toLowerCase().replace(/ /g, '-')]">{{ 'SECTIONS.' + sezione.toUpperCase().replace(' E BEVANDE', '') | translate }}</a>
    </li>
  </ul>
</li>
