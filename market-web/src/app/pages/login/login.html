<div class="login-wrapper">
  <div class="container h-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        
        <div class="card login-card p-4 p-md-5">
          <div class="text-center mb-5">
            <h1 class="fw-bold mb-2">Accedi a Market</h1>
            <p class="text-muted">Inserisci le tue credenziali per continuare</p>
          </div>
          
          <!-- Messaggio di Errore -->
          <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center mb-4 border-0" style="border-radius: 12px;" role="alert">
            <i class="bi bi-exclamation-circle-fill flex-shrink-0 me-3 fs-4"></i>
            <div>{{ errorMessage }}</div>
          </div>
          
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="mb-4">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" formControlName="email" class="form-control" 
                     [ngClass]="{ 'is-invalid': isSubmitted && f['email'].errors }"
                     placeholder="nome@esempio.com">
              <div *ngIf="isSubmitted && f['email'].errors" class="invalid-feedback">
                <span *ngIf="f['email'].errors['required']">L'email è obbligatoria</span>
                <span *ngIf="f['email'].errors['email']">Inserisci un indirizzo email valido</span>
              </div>
            </div>
            
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" formControlName="password" class="form-control"
                     [ngClass]="{ 'is-invalid': isSubmitted && f['password'].errors }"
                     placeholder="Inserisci password">
              <div *ngIf="isSubmitted && f['password'].errors" class="invalid-feedback">
                <span *ngIf="f['password'].errors['required']">La password è obbligatoria</span>
                <span *ngIf="f['password'].errors['minlength']">La password deve avere almeno 8 caratteri</span>
              </div>
            </div>
            
            <div class="d-flex justify-content-end mb-4">
              <a href="#" class="text-decoration-none small fw-semibold" style="color: var(--primary-accent);">
                Hai dimenticato la password?
              </a>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-3 mb-4 fw-bold fs-5">
              Accedi
            </button>
            
            <div class="text-center">
              <span class="text-muted">Non hai un account? </span>
              <a routerLink="/signup" class="text-decoration-none fw-semibold" style="color: var(--primary-accent);">
                Registrati ora
              </a>
            </div>
          </form>
          
        </div>
      </div>
    </div>
  </div>
</div>
