<div class="container py-5 mt-5">
  <!-- Riga con il titolo principale della sezione -->
  <div class="row">
    <div class="col-12 text-center mb-5">
      <h2 class="display-4 fw-bold text-capitalize">Elettronica</h2>
      <p class="text-muted">Esplora tutti i prodotti della categoria Elettronica</p>
    </div>
  </div>
  
  <!-- Usiamo *ngIf per assicurarci che l'Observable (il flusso) venga aperto (async) prima di usarlo come array -->
  <div class="row" *ngIf="(products$ | async) as products">
    
    <!-- Div visualizzato solo se non sono presenti prodotti per l'elettronica -->
    <div class="col-12" *ngIf="products.length === 0">
      <div class="card p-5 text-center empty-state-card">
        <!-- Icona laptop specifica per questa sezione (da Bootstrap Icons) -->
        <i class="bi bi-laptop display-1 text-muted mb-3"></i>
        <h4 class="mb-2">Nessun prodotto trovato</h4>
        <p class="text-muted mb-0">L'elenco dei prodotti per questa sezione è attualmente vuoto.</p>
      </div>
    </div>
    
    <!-- Iterazione (*ngFor) su ogni prodotto per stampare una griglia (ogni card occuperà col-lg-4, cioè 1/3 della riga) -->
    <div class="col-12 col-md-6 col-lg-4 mb-4" *ngFor="let product of products">
      <div class="card h-100 p-4">
        <h3 class="h5 fw-bold">{{ product.name }}</h3>
        <!-- Usiamo la pipe Angular | currency:'EUR' per mettere in automatico il simbolo € davanti al prezzo -->
        <p class="fs-4 fw-semibold text-primary-accent mb-3">{{ product.price | currency:'EUR' }}</p>
        <p class="text-muted small mb-0">{{ product.description }}</p>
      </div>
    </div>
  </div>
</div>
