<div class="sticky-top" style="top: 20px;">
  
  <div *ngIf="prodotto; else vuoto" class="card border-pink shadow">
    <div class="card-header text-white" style="background-color: #e84898;">
      <h4 class="mb-0">Dettaglio Prodotto</h4>
    </div>
    <div class="card-body">
      <h3 class="card-title">{{ prodotto.name }}</h3>
      <span class="badge bg-secondary mb-3">ID: {{ prodotto.id }} | {{ prodotto.category }}</span>
      
      <h5 class="text-muted">Descrizione:</h5>
      <p class="lead fs-6">{{ prodotto.description }}</p>
      
      <hr>
      <div class="d-flex justify-content-between align-items-center">
        <span>Prezzo finale:</span>
        <h3 class="text-danger mb-0 fw-bold">{{ prodotto.price }} €</h3>
      </div>
    </div>
  </div>

  <ng-template #vuoto>
    <div class="alert shadow-sm text-center py-5" style="background-color: #fff0f5; border: 1px dashed #e84898; color: #e84898;">
      <i class="fs-1 d-block mb-3">🛒</i>
      <h5>Nessun prodotto selezionato</h5>
      <p class="mb-0 text-dark">Clicca sul pulsante "Dettagli" di un prodotto per visualizzare la sua scheda completa.</p>
    </div>
  </ng-template>

</div>
