<div class="container mt-4">
  <h2 class="mb-4" style="color: #e84898;">{{ titolo }}</h2>
  
  <div class="btn-group mb-4 w-100 shadow-sm">
    <button (click)="filtraCategoria('Tutti')" [class.active]="selectedCategory === 'Tutti'" class="btn btn-outline-pink">Tutti</button>
    <button *ngFor="let cat of categorie" (click)="filtraCategoria(cat)" [class.active]="selectedCategory === cat" class="btn btn-outline-pink">{{ cat }}</button>
  </div>

  <div class="card p-3 mb-4 shadow-sm border-0" style="background-color: #fff0f5;">
    <h6 class="text-muted">Aggiungi nuovo prodotto</h6>
    <div class="row g-2 align-items-center">
      <div class="col-md-3">
        <input type="text" [(ngModel)]="nuovoProdotto.name" class="form-control form-control-sm" placeholder="Nome">
      </div>
      <div class="col-md-2">
        <input type="number" [(ngModel)]="nuovoProdotto.price" class="form-control form-control-sm" placeholder="Prezzo €">
      </div>
      <div class="col-md-3">
        <input type="text" [(ngModel)]="nuovoProdotto.description" class="form-control form-control-sm" placeholder="Descrizione">
      </div>
      <div class="col-md-2">
        <select *ngIf="selectedCategory === 'Tutti'" [(ngModel)]="nuovoProdotto.category" class="form-select form-select-sm">
          <option *ngFor="let cat of categorie" [value]="cat">{{ cat }}</option>
        </select>
        <input *ngIf="selectedCategory !== 'Tutti'" type="text" [value]="selectedCategory" class="form-control form-control-sm" disabled>
      </div>
      <div class="col-md-2">
        <button (click)="aggiungiProdotto()" class="btn btn-sm w-100 text-white" style="background-color: #e84898;">Aggiungi</button>
      </div>
    </div>
  </div>

  <div class="row">
    <ng-container *ngFor="let p of prodotti">
      <div class="col-md-4 mb-3" *ngIf="selectedCategory === 'Tutti' || p.category === selectedCategory">
        <div class="card h-100 shadow-sm border-0" style="background-color: #fff0f5;">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-dark">{{ p.name }}</h5>
            <p class="card-subtitle mb-2 text-muted">ID: {{ p.id }}</p>
            <p class="fw-bold text-primary">{{ p.price }} €</p>
            
            <div class="mt-auto d-flex gap-2">
              <button class="btn btn-outline-danger w-50" (click)="selezionaProdotto(p)">Dettagli</button>
              <button class="btn btn-outline-secondary w-50" (click)="eliminaProdotto(p.id)">Elimina</button>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
  </div>

  <hr class="my-5">
  <app-product-detail-component [prodotto]="prodottoSelezionato"></app-product-detail-component>
</div>
